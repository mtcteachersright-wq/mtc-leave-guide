<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MTC 教師權益 — 交流討論區</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600&family=Noto+Sans+TC:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f7f5f0;
    --surface: #ffffff;
    --border: #e2ddd6;
    --text: #1a1814;
    --muted: #7a7269;
    --accent: #8b4513;
    --accent-light: #f5ede6;
    --admin-bg: #eef4ee;
    --admin-text: #2d5a2d;
    --radius: 12px;
    --radius-sm: 8px;
  }

  body {
    font-family: 'Noto Sans TC', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 0;
  }

  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 1.25rem 2rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .site-title {
    font-family: 'Noto Serif TC', serif;
    font-size: 18px;
    font-weight: 600;
    color: var(--text);
    letter-spacing: 0.02em;
  }

  .site-subtitle {
    font-size: 12px;
    color: var(--muted);
    margin-top: 2px;
  }

  #user-bar {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .avatar {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: var(--accent-light);
    color: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 500;
    flex-shrink: 0;
    overflow: hidden;
  }

  .avatar img { width: 100%; height: 100%; object-fit: cover; }

  .user-name { font-size: 14px; font-weight: 500; }
  .user-role { font-size: 11px; color: var(--muted); }

  .btn {
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 13px;
    padding: 7px 16px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text);
    cursor: pointer;
    transition: background 0.15s;
  }
  .btn:hover { background: var(--bg); }
  .btn-primary {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  .btn-primary:hover { background: #6f3510; border-color: #6f3510; }

  .btn-google {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-size: 14px;
    padding: 10px 22px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    font-family: 'Noto Sans TC', sans-serif;
    transition: background 0.15s, box-shadow 0.15s;
  }
  .btn-google:hover { background: var(--bg); box-shadow: 0 1px 4px rgba(0,0,0,0.08); }

  main {
    max-width: 720px;
    margin: 0 auto;
    padding: 2rem 1.5rem 4rem;
  }

  #login-section {
    margin: 3rem auto;
    max-width: 400px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 2rem;
    text-align: center;
  }

  .login-icon {
    width: 52px;
    height: 52px;
    background: var(--accent-light);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 1rem;
    font-size: 22px;
  }

  .login-title {
    font-family: 'Noto Serif TC', serif;
    font-size: 17px;
    font-weight: 600;
    margin-bottom: 8px;
  }

  .login-desc {
    font-size: 13px;
    color: var(--muted);
    line-height: 1.7;
    margin-bottom: 1.5rem;
  }

  #compose-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.25rem;
    margin-bottom: 1.5rem;
  }

  textarea {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 10px 12px;
    font-size: 14px;
    font-family: 'Noto Sans TC', sans-serif;
    color: var(--text);
    background: var(--bg);
    resize: none;
    min-height: 90px;
    outline: none;
    transition: border-color 0.15s;
  }
  textarea:focus { border-color: var(--accent); }

  .compose-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 10px;
    gap: 8px;
  }

  .compose-hint { font-size: 12px; color: var(--muted); }

  .threads { display: flex; flex-direction: column; gap: 1rem; }

  .post-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.25rem;
  }

  .post-header {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    margin-bottom: 10px;
  }

  .post-meta { flex: 1; }
  .post-nick { font-size: 14px; font-weight: 500; }
  .post-time { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .post-body { font-size: 14px; line-height: 1.7; color: var(--text); margin-bottom: 12px; }

  .post-actions { display: flex; gap: 6px; flex-wrap: wrap; }

  .btn-sm {
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    font-family: 'Noto Sans TC', sans-serif;
    transition: background 0.1s;
  }
  .btn-sm:hover { background: var(--bg); color: var(--text); }
  .btn-sm-danger { color: #b91c1c; }
  .btn-sm-danger:hover { background: #fef2f2; border-color: #fca5a5; }

  .admin-badge {
    font-size: 10px;
    background: var(--admin-bg);
    color: var(--admin-text);
    padding: 2px 7px;
    border-radius: 20px;
    font-weight: 500;
    margin-left: 6px;
    vertical-align: middle;
  }

  .replies {
    margin-top: 10px;
    margin-left: 2rem;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .reply-card {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 10px 12px;
  }

  .reply-header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 6px;
  }

  .reply-body { font-size: 13px; line-height: 1.6; color: var(--text); }

  .reply-compose {
    margin-top: 10px;
    margin-left: 2rem;
    display: flex;
    gap: 8px;
  }

  .reply-compose textarea {
    flex: 1;
    min-height: 60px;
    font-size: 13px;
  }

  .reply-compose-btns {
    display: flex;
    flex-direction: column;
    gap: 6px;
    justify-content: flex-end;
  }

  .section-label {
    font-size: 12px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 12px;
    font-weight: 500;
  }

  .empty-state {
    text-align: center;
    padding: 3rem 1rem;
    color: var(--muted);
    font-size: 14px;
  }

  .loading { text-align: center; padding: 2rem; color: var(--muted); font-size: 14px; }

  #nickname-modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    z-index: 999;
    align-items: center;
    justify-content: center;
  }
  #nickname-modal.show { display: flex; }

  .modal-box {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 2rem;
    width: 340px;
    max-width: 90vw;
  }

  .modal-title {
    font-family: 'Noto Serif TC', serif;
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 8px;
  }

  .modal-desc { font-size: 13px; color: var(--muted); margin-bottom: 1rem; line-height: 1.6; }

  .modal-input {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 9px 12px;
    font-size: 14px;
    font-family: 'Noto Sans TC', sans-serif;
    color: var(--text);
    background: var(--bg);
    outline: none;
    margin-bottom: 1rem;
  }
  .modal-input:focus { border-color: var(--accent); }

  .modal-footer { display: flex; justify-content: flex-end; gap: 8px; }

  #toast {
    position: fixed;
    bottom: 2rem;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--text);
    color: #fff;
    padding: 10px 20px;
    border-radius: 20px;
    font-size: 13px;
    opacity: 0;
    transition: opacity 0.2s, transform 0.2s;
    pointer-events: none;
    z-index: 9999;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<header>
  <div>
    <div class="site-title">MTC 教師權益</div>
    <div class="site-subtitle">交流討論區</div>
  </div>
  <div id="user-bar">
    <div id="auth-loading" style="font-size:13px;color:var(--muted);">載入中...</div>
    <div id="auth-logged-out" style="display:none;">
      <button class="btn-google" onclick="signInWithGoogle()">
        <svg width="16" height="16" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
        以 Google 帳號登入
      </button>
    </div>
    <div id="auth-logged-in" style="display:none; align-items:center; gap:10px;">
      <div class="avatar" id="header-avatar"></div>
      <div>
        <div class="user-name" id="header-name"></div>
        <div class="user-role" id="header-role"></div>
      </div>
      <button class="btn" onclick="signOut()">登出</button>
    </div>
  </div>
</header>

<main>
  <div id="login-section" style="display:none;">
    <div class="login-icon">💬</div>
    <div class="login-title">歡迎加入討論</div>
    <div class="login-desc">請以 Google 帳號登入後留言。<br>您的 Email 不會公開顯示，僅供管理者聯繫使用。</div>
    <button class="btn-google" onclick="signInWithGoogle()">
      <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      以 Google 帳號登入
    </button>
  </div>

  <div id="board-section" style="display:none;">
    <div id="compose-box">
      <textarea id="compose-input" placeholder="分享您的問題或想法..."></textarea>
      <div class="compose-footer">
        <span class="compose-hint">顯示名稱：<strong id="compose-nick-display"></strong>（Email 不公開）</span>
        <button class="btn btn-primary" onclick="submitPost()">發佈留言</button>
      </div>
    </div>

    <div class="section-label">最新討論</div>
    <div id="loading" class="loading">載入中...</div>
    <div class="threads" id="threads"></div>
  </div>
</main>

<!-- 暱稱設定 Modal -->
<div id="nickname-modal">
  <div class="modal-box">
    <div class="modal-title">設定您的暱稱</div>
    <div class="modal-desc">請設定一個公開顯示的名稱。您的 Email 不會顯示給其他人看。</div>
    <input class="modal-input" id="nickname-input" type="text" placeholder="例如：王小明、匿名老師..." maxlength="20">
    <div class="modal-footer">
      <button class="btn btn-primary" onclick="saveNickname()">確認並繼續</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<!-- Firebase -->
<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
  import { getAuth, GoogleAuthProvider, signInWithPopup, signOut as fbSignOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
  import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, query, orderBy, serverTimestamp, onSnapshot } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

  // ★ 你的 Firebase 設定
  const firebaseConfig = {
    apiKey: "AIzaSyBk3On7USSfw-MrQtv1CIA_IplDL19LBBU",
    authDomain: "mtctechers-rights.firebaseapp.com",
    projectId: "mtctechers-rights",
    storageBucket: "mtctechers-rights.firebasestorage.app",
    messagingSenderId: "206354495513",
    appId: "1:206354495513:web:6955555c004b879dc01288",
    measurementId: "G-WFG0GRFV6B"
  };

  const ADMIN_EMAIL = 'mtc.teachers.right@gmail.com';

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  let currentUser = null;
  let unsubscribe = null;

  function isAdmin(user) {
    return user && user.email === ADMIN_EMAIL;
  }

  function getNickname(uid) {
    return localStorage.getItem('nick_' + uid) || null;
  }

  function setNickname(uid, nick) {
    localStorage.setItem('nick_' + uid, nick);
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  }

  function formatTime(ts) {
    if (!ts) return '';
    const d = ts.toDate ? ts.toDate() : new Date(ts);
    return d.toLocaleDateString('zh-TW', { month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' });
  }

  function getInitials(name) {
    return name ? name.slice(0, 2) : '匿';
  }

  window.signInWithGoogle = async function() {
    const provider = new GoogleAuthProvider();
    try {
      await signInWithPopup(auth, provider);
    } catch (e) {
      showToast('登入失敗，請再試一次');
    }
  };

  window.signOut = async function() {
    if (unsubscribe) unsubscribe();
    await fbSignOut(auth);
  };

  window.saveNickname = function() {
    const input = document.getElementById('nickname-input').value.trim();
    if (!input) { showToast('請輸入暱稱'); return; }
    setNickname(currentUser.uid, input);
    document.getElementById('nickname-modal').classList.remove('show');
    document.getElementById('compose-nick-display').textContent = input;
    showToast('暱稱設定完成！');
  };

  onAuthStateChanged(auth, (user) => {
    document.getElementById('auth-loading').style.display = 'none';
    currentUser = user;

    if (user) {
      const nick = getNickname(user.uid) || (isAdmin(user) ? '管理者' : '');
      document.getElementById('auth-logged-in').style.display = 'flex';
      document.getElementById('auth-logged-out').style.display = 'none';
      document.getElementById('login-section').style.display = 'none';
      document.getElementById('board-section').style.display = 'block';

      const avatarEl = document.getElementById('header-avatar');
      if (user.photoURL) {
        avatarEl.innerHTML = `<img src="${user.photoURL}" alt="">`;
      } else {
        avatarEl.textContent = getInitials(nick || user.displayName || '');
      }
      document.getElementById('header-name').textContent = nick || user.displayName || '';
      document.getElementById('header-role').textContent = isAdmin(user) ? '管理者' : '一般使用者';
      document.getElementById('compose-nick-display').textContent = nick || user.displayName || '';

      if (!nick && !isAdmin(user)) {
        setTimeout(() => {
          document.getElementById('nickname-input').value = user.displayName || '';
          document.getElementById('nickname-modal').classList.add('show');
        }, 500);
      }

      loadPosts();
    } else {
      document.getElementById('auth-logged-in').style.display = 'none';
      document.getElementById('auth-logged-out').style.display = 'flex';
      document.getElementById('login-section').style.display = 'block';
      document.getElementById('board-section').style.display = 'none';
      document.getElementById('threads').innerHTML = '';
    }
  });

  function loadPosts() {
    const q = query(collection(db, 'posts'), orderBy('createdAt', 'desc'));
    if (unsubscribe) unsubscribe();
    unsubscribe = onSnapshot(q, async (snapshot) => {
      document.getElementById('loading').style.display = 'none';
      const threadsEl = document.getElementById('threads');
      threadsEl.innerHTML = '';

      if (snapshot.empty) {
        threadsEl.innerHTML = '<div class="empty-state">還沒有留言，成為第一個留言的人吧！</div>';
        return;
      }

      for (const postDoc of snapshot.docs) {
        const post = postDoc.data();
        const repliesSnap = await getDocs(query(collection(db, 'posts', postDoc.id, 'replies'), orderBy('createdAt', 'asc')));
        const replies = repliesSnap.docs.map(r => ({ id: r.id, ...r.data() }));
        threadsEl.appendChild(renderPost(postDoc.id, post, replies));
      }
    });
  }

  function renderPost(postId, post, replies) {
    const div = document.createElement('div');
    div.className = 'post-card';
    div.id = 'post-' + postId;

    const nick = post.nick || '匿名';
    const isAdminPost = post.isAdmin;
    const canDelete = currentUser && (isAdmin(currentUser) || currentUser.uid === post.uid);

    let repliesHTML = '';
    for (const r of replies) {
      const rNick = r.nick || '匿名';
      const rAdmin = r.isAdmin;
      const rCanDelete = currentUser && isAdmin(currentUser);
      repliesHTML += `
        <div class="reply-card" id="reply-${postId}-${r.id}">
          <div class="reply-header">
            <div class="avatar" style="width:26px;height:26px;font-size:11px;background:${rAdmin ? 'var(--admin-bg)' : 'var(--accent-light)'};color:${rAdmin ? 'var(--admin-text)' : 'var(--accent)'};">${getInitials(rNick)}</div>
            <span style="font-size:13px;font-weight:500;">${rNick}${rAdmin ? '<span class="admin-badge">管理者</span>' : ''}</span>
            <span style="font-size:11px;color:var(--muted);margin-left:auto;">${formatTime(r.createdAt)}</span>
            ${rCanDelete ? `<button class="btn-sm btn-sm-danger" onclick="deleteReply('${postId}','${r.id}')">刪除</button>` : ''}
          </div>
          <div class="reply-body">${escHtml(r.body)}</div>
        </div>`;
    }

    const adminReplyBtn = currentUser && isAdmin(currentUser)
      ? `<button class="btn-sm" onclick="toggleReply('${postId}')">回覆</button>` : '';
    const userReplyBtn = currentUser && !isAdmin(currentUser)
      ? `<button class="btn-sm" onclick="toggleReply('${postId}')">回覆</button>` : '';

    div.innerHTML = `
      <div class="post-header">
        <div class="avatar" style="background:${isAdminPost ? 'var(--admin-bg)' : 'var(--accent-light)'};color:${isAdminPost ? 'var(--admin-text)' : 'var(--accent)'};">${getInitials(nick)}</div>
        <div class="post-meta">
          <div class="post-nick">${escHtml(nick)}${isAdminPost ? '<span class="admin-badge">管理者</span>' : ''}</div>
          <div class="post-time">${formatTime(post.createdAt)}</div>
        </div>
      </div>
      <div class="post-body">${escHtml(post.body)}</div>
      <div class="post-actions">
        ${adminReplyBtn}${userReplyBtn}
        ${canDelete ? `<button class="btn-sm btn-sm-danger" onclick="deletePost('${postId}')">刪除</button>` : ''}
        ${isAdmin(currentUser) && post.email ? `<span style="font-size:11px;color:var(--muted);margin-left:4px;">✉ ${escHtml(post.email)}</span>` : ''}
      </div>
      <div class="replies" id="replies-${postId}">${repliesHTML}</div>
      <div class="reply-compose" id="reply-compose-${postId}" style="display:none;">
        <textarea id="reply-input-${postId}" placeholder="輸入回覆..."></textarea>
        <div class="reply-compose-btns">
          <button class="btn btn-primary" style="font-size:12px;padding:6px 12px;" onclick="submitReply('${postId}')">送出</button>
          <button class="btn" style="font-size:12px;padding:6px 12px;" onclick="toggleReply('${postId}')">取消</button>
        </div>
      </div>`;
    return div;
  }

  function escHtml(str) {
    return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
  }

  window.toggleReply = function(postId) {
    const el = document.getElementById('reply-compose-' + postId);
    el.style.display = el.style.display === 'none' ? 'flex' : 'none';
    if (el.style.display === 'flex') document.getElementById('reply-input-' + postId).focus();
  };

  window.submitPost = async function() {
    if (!currentUser) { showToast('請先登入'); return; }
    const body = document.getElementById('compose-input').value.trim();
    if (!body) { showToast('請輸入內容'); return; }
    const nick = getNickname(currentUser.uid) || (isAdmin(currentUser) ? '管理者' : currentUser.displayName || '匿名');
    try {
      await addDoc(collection(db, 'posts'), {
        uid: currentUser.uid,
        email: currentUser.email,
        nick,
        body,
        isAdmin: isAdmin(currentUser),
        createdAt: serverTimestamp()
      });
      document.getElementById('compose-input').value = '';
      showToast('留言已發佈！');
    } catch (e) {
      showToast('發佈失敗：' + e.message);
    }
  };

  window.submitReply = async function(postId) {
    if (!currentUser) return;
    const body = document.getElementById('reply-input-' + postId).value.trim();
    if (!body) { showToast('請輸入回覆內容'); return; }
    const nick = getNickname(currentUser.uid) || (isAdmin(currentUser) ? '管理者' : currentUser.displayName || '匿名');
    try {
      await addDoc(collection(db, 'posts', postId, 'replies'), {
        uid: currentUser.uid,
        email: currentUser.email,
        nick,
        body,
        isAdmin: isAdmin(currentUser),
        createdAt: serverTimestamp()
      });
      document.getElementById('reply-input-' + postId).value = '';
      document.getElementById('reply-compose-' + postId).style.display = 'none';
      showToast('回覆已送出！');
    } catch (e) {
      showToast('回覆失敗：' + e.message);
    }
  };

  window.deletePost = async function(postId) {
    if (!confirm('確定要刪除這則留言嗎？')) return;
    try {
      await deleteDoc(doc(db, 'posts', postId));
      showToast('已刪除');
    } catch (e) {
      showToast('刪除失敗：' + e.message);
    }
  };

  window.deleteReply = async function(postId, replyId) {
    if (!confirm('確定要刪除這則回覆嗎？')) return;
    try {
      await deleteDoc(doc(db, 'posts', postId, 'replies', replyId));
      showToast('已刪除');
    } catch (e) {
      showToast('刪除失敗：' + e.message);
    }
  };
</script>
</body>
</html>
